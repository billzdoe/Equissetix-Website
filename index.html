    <link rel="preconnect" href="https://fonts.googleapis.com">

    <script>
      // GitHub Pages SPA redirect, the decoding half of public/404.html
      // (rafgraph/spa-github-pages). 404.html sends /contact to /?/contact;
      // this turns it back into /contact before the router reads the URL, so
      // it must stay in <head>, ahead of the app bundle. The previous script
      // read sessionStorage.redirect, which 404.html never sets, so every deep
      // link landed on the homepage.
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>
