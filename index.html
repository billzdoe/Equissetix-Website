    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Equissetix",
      "url": "https://equissetix.com",
      "logo": "https://equissetix.com/logo.png",
      "description": "Equine operations software: barn management, compliance, and peer-reviewed sports science",
      "sameAs": [
        "https://linkedin.com/company/equissetix",
        "https://twitter.com/equissetix"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "info@equissetix.com",
        "contactType": "Customer Service"
      }
    }
    </script>
    
    <!-- Structured Data - SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "TrainingTree Pro",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web, iOS, Android",

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // GitHub Pages SPA redirect
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
  </body>
