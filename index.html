    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
    <script>
      // Legacy GitHub Pages SPA links (/?/contact). Cloudflare Pages serves
      // index.html for deep links itself (no 404.html in dist), but old
      // shared or indexed /?/ URLs still decode back to /contact here. It
      // must stay in <head>, ahead of the app bundle.
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>
